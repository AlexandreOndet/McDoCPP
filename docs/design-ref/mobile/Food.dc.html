</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"fries","options":["fries","burger","coffee","drink","nuggets","hashbrown","pie","wrap","muffin","meal"]},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'fries';
    return { isFries: k==='fries', isBurger: k==='burger', isCoffee: k==='coffee', isDrink: k==='drink', isNuggets: k==='nuggets', isHashbrown: k==='hashbrown', isPie: k==='pie', isWrap: k==='wrap', isMuffin: k==='muffin', isMeal: k==='meal' };
  }
}
</script>
</body>
</html>
