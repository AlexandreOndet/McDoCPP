[project]
name = "mcdocpp"
version = "0.1.0"
description = "McDoCPP collector: crawl McDonald's Canada menus, compute reward CPP, publish static JSON"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "duckdb>=1.1",
  "pyarrow>=17",
  "pydantic>=2.8",
  "typer>=0.12",
  "pyyaml>=6",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[project.scripts]
mcdocpp = "mcdocpp.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-jsonschema", "pyarrow-stubs", "boto3-stubs[s3]", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcdocpp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["mcdocpp", "tests", "spike.py"]

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
