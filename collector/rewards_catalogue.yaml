# MyMcDonald's Rewards (Canada) catalogue. Design doc §4.2.
# Matching: name_regex against the en-CA string; once resolved, numeric product IDs are pinned in product_ids
# and take precedence. pick: which variant to use when several match (max = highest price = best CPP).
# availability: all_day | breakfast. kind: illustration key in the food sprite.
# Tier placements marked "verify" are curated from the 2025-09-16 change announcement, not from an API.
versions:
  - version: "2025-09-16"
    valid_from: "2025-09-16"
    valid_to: null
    tiers:
      - tier: 2000
        items:
          - key: hash_brown
            names: {en: "Hash Brown", fr: "Galette de pommes de terre"}
            kind: hashbrown
            availability: breakfast
            product_match: {name_regex: "^Hash Brown$", pick: max}
            product_ids: []
          - key: coffee_sm_md
            names: {en: "Premium Roast Coffee (S/M)", fr: "Café Premium (P/M)"}
            kind: coffee
            availability: all_day
            product_match: {name_regex: "^(Sm|Med) Premium Roast Coffee$", pick: max}
            product_ids: []
          - key: soft_drink_sm_md
            names: {en: "Soft Drink (S/M)", fr: "Boisson gazeuse (P/M)"}
